name: Windows Release Build (Attendance Management System + Developer Suite + Attendance Server)

# Produces the real Windows artifacts (Setup.exe, Portable.exe,
# DeveloperSuite-Setup.exe, AttendanceServer-Setup.exe) that cannot be
# built on Linux -- PyInstaller's bootloader and Inno Setup's ISCC.exe
# both only produce Windows PE binaries. See BUILD_WINDOWS.md for the
# equivalent manual procedure on a real Windows machine; this workflow
# automates the same steps.
#
# Three independent jobs, one release: `build` produces the Attendance
# Client's assets, `build-developer-suite` the Developer Suite's, and
# `build-attendance-server` the platform server's -- all three attach
# to the *same* GitHub Release (the one for the pushed `v*.*.*` tag)
# since they are distributed together. They run in parallel and never
# touch the same output filename (see each job's own comments), so
# there is no race between them beyond each calling the release-attach
# action for the same tag, which softprops/action-gh-release handles
# fine -- each call only adds/replaces the files it lists.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Existing release tag to attach this run's assets to (e.g.
          v1.1.0), without pushing a new tag. Leave empty for an
          ordinary manual build-and-smoke-test run with nothing
          published (the Attach-to-Release steps below are skipped
          entirely when this is empty and the run wasn't itself
          triggered by a tag push).
        required: false
        type: string

# The default GITHUB_TOKEN is read-only unless a workflow explicitly
# requests write access -- without this, the "Attach to GitHub Release"
# step's calls to create/update a release and upload its assets fail
# with "Resource not accessible by integration" even though the token
# can otherwise read the repository fine. contents: write is the
# minimum scope softprops/action-gh-release needs for both the release
# itself and its uploaded files.
permissions:
  contents: write

# windows-latest runners default `run:` steps to PowerShell, not cmd.
# Every step below uses Windows batch (CMD) syntax -- `if exist`/
# `if not exist`, `copy /y`, `exit /b` -- which PowerShell does not
# understand (e.g. it parses `if not exist "X" mkdir "Y"` as a
# malformed PowerShell `if` statement and fails immediately). Setting
# the default shell to cmd for the whole job makes every step's `run:`
# block execute under cmd.exe, matching what each command was written
# for, without needing a per-step override.
defaults:
  run:
    shell: cmd

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime + build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-runtime.txt

      - name: Build onedir app (for the installer)
        run: pyinstaller packaging\pyinstaller\main.spec --noconfirm

      # These smoke-test steps run in real PowerShell on a real Windows
      # runner (not a substitute for it) -- each one launches the actual
      # built/installed executable and asserts it is still running a few
      # seconds later, rather than trusting "the build succeeded" as proof
      # the app starts. QT_QPA_PLATFORM=offscreen is used deliberately: it
      # exercises every line of startup (config, database, license check,
      # main window construction) without depending on the runner having a
      # real interactive desktop/window station, so a failure here means a
      # genuine startup crash, not a CI environment quirk. Any failure
      # prints startup_crash.log (see bootstrap.py) so the cause is visible
      # directly in the workflow log, with no artifact download needed.
      - name: Smoke test - onedir build starts without crashing
        shell: pwsh
        timeout-minutes: 3
        run: |
          $exePath = "dist\AttendanceManagementSystem\AttendanceManagementSystem.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "Executable not found: $exePath"
            exit 1
          }
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:APP_ENVIRONMENT = "testing"
          $env:DB_SQLITE_PATH = "$env:RUNNER_TEMP\smoke_onedir.db"
          $crashLog = "$env:LOCALAPPDATA\AttendanceManagementSystem\logs\startup_crash.log"
          Remove-Item -Path $crashLog -ErrorAction SilentlyContinue
          # Deliberately NOT using -RedirectStandardOutput/-RedirectStandardError:
          # redirecting them gives this process real, non-None stdout/stderr
          # handles, which is NOT what a real double-click or Start Menu
          # launch gets (see bootstrap.py's _ensure_stdio_streams -- a
          # windowed build launched with no attached console has sys.stdout
          # /sys.stderr as None). An earlier version of this test redirected
          # both, which is exactly what let a `sys.stderr is None` crash in
          # setup_logging reach v1.0.1's users despite this smoke test being
          # green. startup_crash.log (below) is the real diagnostic channel
          # regardless -- bootstrap.py opens it directly, independent of
          # stdout/stderr redirection, so nothing is lost by not redirecting.
          $proc = Start-Process -FilePath $exePath -PassThru
          Start-Sleep -Seconds 15
          if ($proc.HasExited) {
            Write-Host "##[error] Onedir executable exited early (code $($proc.ExitCode)) instead of staying running."
            if (Test-Path $crashLog) {
              Write-Host "----- startup_crash.log -----"
              Get-Content $crashLog
            } else {
              Write-Host "No startup_crash.log was written either."
            }
            exit 1
          }
          Write-Host "OK: onedir executable is still running after 15s (PID $($proc.Id))."
          Stop-Process -Id $proc.Id -Force

      - name: Build onefile Portable.exe
        run: |
          pyinstaller packaging\pyinstaller\main_portable.spec --noconfirm
          if not exist "Release" mkdir "Release"
          copy /y "dist\AttendanceManagementSystem-Portable.exe" "Release\Portable.exe"

      - name: Smoke test - portable build starts without crashing
        shell: pwsh
        timeout-minutes: 3
        run: |
          $exePath = "Release\Portable.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "Executable not found: $exePath"
            exit 1
          }
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:APP_ENVIRONMENT = "testing"
          $env:DB_SQLITE_PATH = "$env:RUNNER_TEMP\smoke_portable.db"
          $crashLog = "$env:LOCALAPPDATA\AttendanceManagementSystem\logs\startup_crash.log"
          Remove-Item -Path $crashLog -ErrorAction SilentlyContinue
          # See the onedir smoke test above for why this deliberately does
          # not redirect stdout/stderr.
          $proc = Start-Process -FilePath $exePath -PassThru
          Start-Sleep -Seconds 15
          if ($proc.HasExited) {
            Write-Host "##[error] Portable executable exited early (code $($proc.ExitCode)) instead of staying running."
            if (Test-Path $crashLog) {
              Write-Host "----- startup_crash.log -----"
              Get-Content $crashLog
            } else {
              Write-Host "No startup_crash.log was written either."
            }
            exit 1
          }
          Write-Host "OK: portable executable is still running after 15s (PID $($proc.Id))."
          Stop-Process -Id $proc.Id -Force

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Setup.exe with Inno Setup
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer\setup.iss

      # The one check that most directly answers "does it work after a
      # normal user installs it": silently runs the actual Setup.exe,
      # launches the actual installed .exe from Program Files, then
      # uninstalls -- exercising the full path a real customer goes
      # through, not just the PyInstaller output.
      - name: Smoke test - installed Setup.exe starts without crashing
        shell: pwsh
        timeout-minutes: 5
        run: |
          $installer = "Release\Setup.exe"
          if (-not (Test-Path $installer)) {
            Write-Error "Installer not found: $installer"
            exit 1
          }
          $installProc = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait -PassThru
          if ($installProc.ExitCode -ne 0) {
            Write-Error "Setup.exe exited with code $($installProc.ExitCode) during silent install."
            exit 1
          }
          $installedExe = "$env:ProgramFiles\Attendance Management System\AttendanceManagementSystem.exe"
          if (-not (Test-Path $installedExe)) {
            Write-Error "Installed executable not found at $installedExe"
            exit 1
          }
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:APP_ENVIRONMENT = "testing"
          $env:DB_SQLITE_PATH = "$env:RUNNER_TEMP\smoke_installed.db"
          $crashLog = "$env:LOCALAPPDATA\AttendanceManagementSystem\logs\startup_crash.log"
          Remove-Item -Path $crashLog -ErrorAction SilentlyContinue
          # See the onedir smoke test above for why this deliberately does
          # not redirect stdout/stderr -- this is the closest of all three
          # tests to the real customer scenario (Setup.exe -> Start Menu
          # shortcut -> double-click), so it matters most here.
          $proc = Start-Process -FilePath $installedExe -PassThru
          Start-Sleep -Seconds 15
          $failed = $false
          if ($proc.HasExited) {
            Write-Host "##[error] Installed executable exited early (code $($proc.ExitCode))."
            if (Test-Path $crashLog) {
              Write-Host "----- startup_crash.log -----"
              Get-Content $crashLog
            } else {
              Write-Host "No startup_crash.log was written either."
            }
            $failed = $true
          } else {
            Write-Host "OK: installed executable is still running after 15s (PID $($proc.Id))."
            Stop-Process -Id $proc.Id -Force
          }
          # Uninstall regardless of pass/fail, to leave the runner clean.
          # Inno Setup's uninstaller copies itself to a temp file and
          # relaunches from there to finish the job (so it can delete its
          # own original exe) - the outer process this starts does not
          # reliably exit when that handoff happens, so -Wait can hang
          # long past the point where uninstall has actually finished.
          # Bounded to 60s and never allowed to fail this step: cleaning
          # up after the test is a nicety, not part of what this test
          # verifies (the app already proved it starts, above).
          $uninstaller = "$env:ProgramFiles\Attendance Management System\unins000.exe"
          if (Test-Path $uninstaller) {
            $uninstallProc = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru
            $uninstallProc | Wait-Process -Timeout 60 -ErrorAction SilentlyContinue
            if (-not $uninstallProc.HasExited) {
              Write-Host "Uninstall did not finish within 60s - leaving it be, not treated as a smoke-test failure."
            }
          }
          if ($failed) { exit 1 }

      - name: Copy documentation into Release\
        run: |
          if exist "docs\README.pdf" copy /y "docs\README.pdf" "Release\README.pdf"
          if exist "docs\User Manual.pdf" copy /y "docs\User Manual.pdf" "Release\User Manual.pdf"
          if exist "docs\Administrator Manual.pdf" copy /y "docs\Administrator Manual.pdf" "Release\Administrator Manual.pdf"
          if exist "docs\Installation Guide.pdf" copy /y "docs\Installation Guide.pdf" "Release\Installation Guide.pdf"
          if exist "docs\Release Notes.pdf" copy /y "docs\Release Notes.pdf" "Release\Release Notes.pdf"
          if exist "CHANGELOG.md" copy /y "CHANGELOG.md" "Release\CHANGELOG.md"

      - name: Verify build output exists
        run: |
          if not exist "Release\Setup.exe" (echo Setup.exe missing & exit /b 1)
          if not exist "Release\Portable.exe" (echo Portable.exe missing & exit /b 1)

      - name: Upload Release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AttendanceManagementSystem-Windows-Release
          path: Release/
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            Release/Setup.exe
            Release/Portable.exe
            Release/README.pdf
            Release/User Manual.pdf
            Release/Administrator Manual.pdf
            Release/CHANGELOG.md
          generate_release_notes: true

  # The Developer Suite's own build, entirely independent of the `build`
  # job above (own spec, own installer script, own trimmed dependency
  # list -- see packaging/pyinstaller/developer_suite.spec and
  # requirements-developer-suite-runtime.txt) but publishing to the
  # *same* release: the two applications are versioned independently
  # internally (see developer_suite/config.py's own app_version) but
  # distributed together from this one repository's releases page,
  # since the Developer Suite is what a vendor operator needs to issue
  # the licenses the Attendance Client asks for.
  build-developer-suite:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime + build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-developer-suite-runtime.txt

      - name: Build onedir app (for the installer)
        run: pyinstaller packaging\pyinstaller\developer_suite.spec --noconfirm

      # See the `build` job's identical onedir smoke test above for the
      # full rationale (real Windows runner, offscreen Qt platform,
      # deliberately unredirected stdout/stderr, startup_crash.log as
      # the diagnostic channel). QT_QPA_PLATFORM=offscreen here
      # exercises config load, database init, and the admin
      # auto-login-then-login-window startup path without a stored
      # session (see developer_suite/admin/session_manager.py's
      # try_auto_login -- it returns False immediately with no network
      # call when nothing is stored, so this is safe to run offline).
      - name: Smoke test - onedir build starts without crashing
        shell: pwsh
        timeout-minutes: 3
        run: |
          $exePath = "dist\DeveloperSuite\DeveloperSuite.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "Executable not found: $exePath"
            exit 1
          }
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:DEV_SUITE_ENVIRONMENT = "testing"
          $env:DEV_SUITE_DB_SQLITE_PATH = "$env:RUNNER_TEMP\smoke_devsuite_onedir.db"
          $crashLog = "$env:LOCALAPPDATA\DeveloperSuite\logs\startup_crash.log"
          Remove-Item -Path $crashLog -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath $exePath -PassThru
          Start-Sleep -Seconds 15
          if ($proc.HasExited) {
            Write-Host "##[error] Onedir executable exited early (code $($proc.ExitCode)) instead of staying running."
            if (Test-Path $crashLog) {
              Write-Host "----- startup_crash.log -----"
              Get-Content $crashLog
            } else {
              Write-Host "No startup_crash.log was written either."
            }
            exit 1
          }
          Write-Host "OK: onedir executable is still running after 15s (PID $($proc.Id))."
          Stop-Process -Id $proc.Id -Force

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build DeveloperSuite-Setup.exe with Inno Setup
        run: |
          if not exist "Release" mkdir "Release"
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer\setup_developer_suite.iss

      # Silently runs the actual installer, launches the actual
      # installed .exe from Program Files, then uninstalls -- see the
      # `build` job's identical installed-build smoke test above for
      # the full rationale.
      - name: Smoke test - installed DeveloperSuite-Setup.exe starts without crashing
        shell: pwsh
        timeout-minutes: 5
        run: |
          $installer = "Release\DeveloperSuite-Setup.exe"
          if (-not (Test-Path $installer)) {
            Write-Error "Installer not found: $installer"
            exit 1
          }
          $installProc = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait -PassThru
          if ($installProc.ExitCode -ne 0) {
            Write-Error "DeveloperSuite-Setup.exe exited with code $($installProc.ExitCode) during silent install."
            exit 1
          }
          $installedExe = "$env:ProgramFiles\Developer Suite\DeveloperSuite.exe"
          if (-not (Test-Path $installedExe)) {
            Write-Error "Installed executable not found at $installedExe"
            exit 1
          }
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:DEV_SUITE_ENVIRONMENT = "testing"
          $env:DEV_SUITE_DB_SQLITE_PATH = "$env:RUNNER_TEMP\smoke_devsuite_installed.db"
          $crashLog = "$env:LOCALAPPDATA\DeveloperSuite\logs\startup_crash.log"
          Remove-Item -Path $crashLog -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath $installedExe -PassThru
          Start-Sleep -Seconds 15
          $failed = $false
          if ($proc.HasExited) {
            Write-Host "##[error] Installed executable exited early (code $($proc.ExitCode))."
            if (Test-Path $crashLog) {
              Write-Host "----- startup_crash.log -----"
              Get-Content $crashLog
            } else {
              Write-Host "No startup_crash.log was written either."
            }
            $failed = $true
          } else {
            Write-Host "OK: installed executable is still running after 15s (PID $($proc.Id))."
            Stop-Process -Id $proc.Id -Force
          }
          # Uninstall regardless of pass/fail, to leave the runner clean
          # -- see the `build` job's identical step for why this is
          # bounded to 60s and never allowed to fail this step.
          $uninstaller = "$env:ProgramFiles\Developer Suite\unins000.exe"
          if (Test-Path $uninstaller) {
            $uninstallProc = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru
            $uninstallProc | Wait-Process -Timeout 60 -ErrorAction SilentlyContinue
            if (-not $uninstallProc.HasExited) {
              Write-Host "Uninstall did not finish within 60s - leaving it be, not treated as a smoke-test failure."
            }
          }
          if ($failed) { exit 1 }

      - name: Verify build output exists
        run: |
          if not exist "Release\DeveloperSuite-Setup.exe" (echo DeveloperSuite-Setup.exe missing & exit /b 1)

      - name: Upload Release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeveloperSuite-Windows-Release
          path: Release/DeveloperSuite-Setup.exe
          if-no-files-found: error

      # Deliberately no generate_release_notes here: the release's
      # description is already generated/maintained by the `build`
      # job above (the Attendance Client's own tag-triggered run) --
      # this step's only job is to add one more file to that same,
      # already-described release, never to touch its body.
      #
      # tag_name defaults to the pushed tag on an ordinary tag-push
      # trigger (github.ref_name), or can be pointed at an *existing*
      # release explicitly via the release_tag workflow_dispatch input
      # -- e.g. to attach this asset to a release whose tag was
      # already pushed and built before this job existed, without
      # pushing a new tag or moving the existing one.
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            Release/DeveloperSuite-Setup.exe

  # The Attendance Server's own build -- the third and smallest of the
  # three (no UI at all, see attendance_server.spec's own comments),
  # publishing to the same release the other two jobs do. Unlike the
  # two desktop apps' smoke tests (which only prove the process stays
  # alive), this server's smoke tests hit its own GET /health endpoint
  # over a real HTTP request -- a stronger check that is easy to make
  # here since this application's entire purpose is answering HTTP
  # requests, not rendering a window.
  build-attendance-server:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime + build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-attendance-server-runtime.txt

      - name: Build onedir app (for the installer)
        run: pyinstaller packaging\pyinstaller\attendance_server.spec --noconfirm

      # See the `build` job's onedir smoke test for the general
      # rationale (real Windows runner, deliberately unredirected
      # stdout/stderr -- moot here since console=True already gives
      # this process real stdio, startup_crash.log as the diagnostic
      # channel either way). The readiness check itself is a real
      # GET /health call, polled for up to 20s to give uvicorn time to
      # bind its socket, rather than only checking the process is
      # still alive.
      - name: Smoke test - onedir build serves GET /health
        shell: pwsh
        timeout-minutes: 3
        run: |
          $exePath = "dist\AttendanceServer\AttendanceServer.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "Executable not found: $exePath"
            exit 1
          }
          $env:ATTENDANCE_SERVER_ENVIRONMENT = "testing"
          $env:ATTENDANCE_SERVER_DB_SQLITE_PATH = "$env:RUNNER_TEMP\smoke_server_onedir.db"
          $crashLog = "$env:LOCALAPPDATA\AttendanceServer\logs\startup_crash.log"
          Remove-Item -Path $crashLog -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath $exePath -PassThru
          $healthy = $false
          $deadline = (Get-Date).AddSeconds(20)
          while ((Get-Date) -lt $deadline) {
            if ($proc.HasExited) { break }
            try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:8000/health" -UseBasicParsing -TimeoutSec 2
              if ($response.StatusCode -eq 200) { $healthy = $true; break }
            } catch {
              Start-Sleep -Seconds 1
            }
          }
          if (-not $healthy) {
            Write-Host "##[error] Onedir server never answered GET /health (exited: $($proc.HasExited), exit code: $($proc.ExitCode))."
            if (Test-Path $crashLog) {
              Write-Host "----- startup_crash.log -----"
              Get-Content $crashLog
            } else {
              Write-Host "No startup_crash.log was written either."
            }
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
            exit 1
          }
          Write-Host "OK: onedir server answered GET /health with 200 (PID $($proc.Id))."
          Stop-Process -Id $proc.Id -Force

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build AttendanceServer-Setup.exe with Inno Setup
        run: |
          if not exist "Release" mkdir "Release"
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer\setup_attendance_server.iss

      # Silently runs the actual installer, launches the actual
      # installed .exe from Program Files, polls GET /health, then
      # uninstalls -- see the `build` job's identical installed-build
      # smoke test for the general rationale.
      - name: Smoke test - installed AttendanceServer-Setup.exe serves GET /health
        shell: pwsh
        timeout-minutes: 5
        run: |
          $installer = "Release\AttendanceServer-Setup.exe"
          if (-not (Test-Path $installer)) {
            Write-Error "Installer not found: $installer"
            exit 1
          }
          $installProc = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait -PassThru
          if ($installProc.ExitCode -ne 0) {
            Write-Error "AttendanceServer-Setup.exe exited with code $($installProc.ExitCode) during silent install."
            exit 1
          }
          $installedExe = "$env:ProgramFiles\Attendance Server\AttendanceServer.exe"
          if (-not (Test-Path $installedExe)) {
            Write-Error "Installed executable not found at $installedExe"
            exit 1
          }
          $env:ATTENDANCE_SERVER_ENVIRONMENT = "testing"
          $env:ATTENDANCE_SERVER_DB_SQLITE_PATH = "$env:RUNNER_TEMP\smoke_server_installed.db"
          $crashLog = "$env:LOCALAPPDATA\AttendanceServer\logs\startup_crash.log"
          Remove-Item -Path $crashLog -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath $installedExe -PassThru
          $healthy = $false
          $deadline = (Get-Date).AddSeconds(20)
          while ((Get-Date) -lt $deadline) {
            if ($proc.HasExited) { break }
            try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:8000/health" -UseBasicParsing -TimeoutSec 2
              if ($response.StatusCode -eq 200) { $healthy = $true; break }
            } catch {
              Start-Sleep -Seconds 1
            }
          }
          $failed = $false
          if (-not $healthy) {
            Write-Host "##[error] Installed server never answered GET /health (exited: $($proc.HasExited), exit code: $($proc.ExitCode))."
            if (Test-Path $crashLog) {
              Write-Host "----- startup_crash.log -----"
              Get-Content $crashLog
            } else {
              Write-Host "No startup_crash.log was written either."
            }
            $failed = $true
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          } else {
            Write-Host "OK: installed server answered GET /health with 200 (PID $($proc.Id))."
            Stop-Process -Id $proc.Id -Force
          }
          # Uninstall regardless of pass/fail, to leave the runner clean
          # -- see the `build` job's identical step for why this is
          # bounded to 60s and never allowed to fail this step.
          $uninstaller = "$env:ProgramFiles\Attendance Server\unins000.exe"
          if (Test-Path $uninstaller) {
            $uninstallProc = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru
            $uninstallProc | Wait-Process -Timeout 60 -ErrorAction SilentlyContinue
            if (-not $uninstallProc.HasExited) {
              Write-Host "Uninstall did not finish within 60s - leaving it be, not treated as a smoke-test failure."
            }
          }
          if ($failed) { exit 1 }

      - name: Verify build output exists
        run: |
          if not exist "Release\AttendanceServer-Setup.exe" (echo AttendanceServer-Setup.exe missing & exit /b 1)

      - name: Upload Release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AttendanceServer-Windows-Release
          path: Release/AttendanceServer-Setup.exe
          if-no-files-found: error

      # Deliberately no generate_release_notes here, same reasoning as
      # the build-developer-suite job's identical step.
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            Release/AttendanceServer-Setup.exe

  # Proves the full license lifecycle -- create customer, issue a
  # license, copy/export it, activate the Attendance Client with it --
  # actually works on a real, freshly-provisioned Windows machine (every
  # windows-latest runner is a clean VM, imaged fresh for this one job),
  # not just on the Linux sandbox this codebase is normally developed
  # in. Runs the vendor (Developer Suite) and client (Attendance Client)
  # license code from source rather than the frozen .exe from the other
  # jobs above: PyInstaller builds have no way to run pytest inside
  # them, so this is what "test the Vendor/Client application" means on
  # a CI runner -- the exact same license_service.py, license_key.py,
  # license_key_dialog.py and license_window.py modules the other jobs'
  # PyInstaller builds freeze verbatim into DeveloperSuite-Setup.exe and
  # Setup.exe, just invoked directly instead of through a frozen
  # bootloader. licensing/machine_id.py uses only stdlib platform/uuid
  # (no OS-specific registry/WMI calls), so this genuinely exercises the
  # same machine-ID and signing code paths the frozen apps use, just
  # computing a different (still valid) fingerprint for this runner.
  windows-license-lifecycle-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # QT_QPA_PLATFORM=offscreen: the runner has no interactive desktop
      # session, but this still constructs and drives the real
      # LicenseKeyDialog and LicenseActivationWindow QWidgets (button
      # clicks, clipboard, text fields) -- it is a headless *display*,
      # not a mock of the widgets themselves.
      - name: Run full license lifecycle test (create customer -> issue -> copy/export -> activate)
        env:
          QT_QPA_PLATFORM: offscreen
          APP_ENVIRONMENT: testing
        run: python -m pytest tests/test_license_issuance_end_to_end.py tests/test_licensing_phase1.py -v
