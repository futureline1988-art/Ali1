name: Windows Release Build (Attendance Management System)

# Produces the real Windows artifacts (Setup.exe, Portable.exe) that
# cannot be built on Linux -- PyInstaller's bootloader and Inno Setup's
# ISCC.exe both only produce Windows PE binaries. See BUILD_WINDOWS.md
# for the equivalent manual procedure on a real Windows machine; this
# workflow automates the same steps.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

# The default GITHUB_TOKEN is read-only unless a workflow explicitly
# requests write access -- without this, the "Attach to GitHub Release"
# step's calls to create/update a release and upload its assets fail
# with "Resource not accessible by integration" even though the token
# can otherwise read the repository fine. contents: write is the
# minimum scope softprops/action-gh-release needs for both the release
# itself and its uploaded files.
permissions:
  contents: write

# windows-latest runners default `run:` steps to PowerShell, not cmd.
# Every step below uses Windows batch (CMD) syntax -- `if exist`/
# `if not exist`, `copy /y`, `exit /b` -- which PowerShell does not
# understand (e.g. it parses `if not exist "X" mkdir "Y"` as a
# malformed PowerShell `if` statement and fails immediately). Setting
# the default shell to cmd for the whole job makes every step's `run:`
# block execute under cmd.exe, matching what each command was written
# for, without needing a per-step override.
defaults:
  run:
    shell: cmd

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime + build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-runtime.txt

      - name: Build onedir app (for the installer)
        run: pyinstaller packaging\pyinstaller\main.spec --noconfirm

      # These smoke-test steps run in real PowerShell on a real Windows
      # runner (not a substitute for it) -- each one launches the actual
      # built/installed executable and asserts it is still running a few
      # seconds later, rather than trusting "the build succeeded" as proof
      # the app starts. QT_QPA_PLATFORM=offscreen is used deliberately: it
      # exercises every line of startup (config, database, license check,
      # main window construction) without depending on the runner having a
      # real interactive desktop/window station, so a failure here means a
      # genuine startup crash, not a CI environment quirk. Any failure
      # prints startup_crash.log (see bootstrap.py) so the cause is visible
      # directly in the workflow log, with no artifact download needed.
      - name: Smoke test - onedir build starts without crashing
        shell: pwsh
        timeout-minutes: 3
        run: |
          $exePath = "dist\AttendanceManagementSystem\AttendanceManagementSystem.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "Executable not found: $exePath"
            exit 1
          }
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:APP_ENVIRONMENT = "testing"
          $env:DB_SQLITE_PATH = "$env:RUNNER_TEMP\smoke_onedir.db"
          $crashLog = "$env:LOCALAPPDATA\AttendanceManagementSystem\logs\startup_crash.log"
          Remove-Item -Path $crashLog -ErrorAction SilentlyContinue
          $stdout = "$env:RUNNER_TEMP\onedir_stdout.log"
          $stderr = "$env:RUNNER_TEMP\onedir_stderr.log"
          # A windowed (console=False) build still has real stdout/stderr
          # handles when they're explicitly redirected at process creation
          # like this -- it is only an *inherited console window* that a
          # windowed build lacks, not the handles themselves. This is how
          # faulthandler's native-crash traceback (see bootstrap.py) gets
          # captured even though nothing is visible on a real desktop.
          $proc = Start-Process -FilePath $exePath -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 15
          if ($proc.HasExited) {
            Write-Host "##[error] Onedir executable exited early (code $($proc.ExitCode)) instead of staying running."
            if (Test-Path $crashLog) {
              Write-Host "----- startup_crash.log -----"
              Get-Content $crashLog
            } else {
              Write-Host "No startup_crash.log was written either."
            }
            Write-Host "----- stdout -----"
            if (Test-Path $stdout) { Get-Content $stdout }
            Write-Host "----- stderr -----"
            if (Test-Path $stderr) { Get-Content $stderr }
            exit 1
          }
          Write-Host "OK: onedir executable is still running after 15s (PID $($proc.Id))."
          Stop-Process -Id $proc.Id -Force

      - name: Build onefile Portable.exe
        run: |
          pyinstaller packaging\pyinstaller\main_portable.spec --noconfirm
          if not exist "Release" mkdir "Release"
          copy /y "dist\AttendanceManagementSystem-Portable.exe" "Release\Portable.exe"

      - name: Smoke test - portable build starts without crashing
        shell: pwsh
        timeout-minutes: 3
        run: |
          $exePath = "Release\Portable.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "Executable not found: $exePath"
            exit 1
          }
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:APP_ENVIRONMENT = "testing"
          $env:DB_SQLITE_PATH = "$env:RUNNER_TEMP\smoke_portable.db"
          $crashLog = "$env:LOCALAPPDATA\AttendanceManagementSystem\logs\startup_crash.log"
          Remove-Item -Path $crashLog -ErrorAction SilentlyContinue
          $stdout = "$env:RUNNER_TEMP\portable_stdout.log"
          $stderr = "$env:RUNNER_TEMP\portable_stderr.log"
          $proc = Start-Process -FilePath $exePath -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 15
          if ($proc.HasExited) {
            Write-Host "##[error] Portable executable exited early (code $($proc.ExitCode)) instead of staying running."
            if (Test-Path $crashLog) {
              Write-Host "----- startup_crash.log -----"
              Get-Content $crashLog
            } else {
              Write-Host "No startup_crash.log was written either."
            }
            Write-Host "----- stdout -----"
            if (Test-Path $stdout) { Get-Content $stdout }
            Write-Host "----- stderr -----"
            if (Test-Path $stderr) { Get-Content $stderr }
            exit 1
          }
          Write-Host "OK: portable executable is still running after 15s (PID $($proc.Id))."
          Stop-Process -Id $proc.Id -Force

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Setup.exe with Inno Setup
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer\setup.iss

      # The one check that most directly answers "does it work after a
      # normal user installs it": silently runs the actual Setup.exe,
      # launches the actual installed .exe from Program Files, then
      # uninstalls -- exercising the full path a real customer goes
      # through, not just the PyInstaller output.
      - name: Smoke test - installed Setup.exe starts without crashing
        shell: pwsh
        timeout-minutes: 5
        run: |
          $installer = "Release\Setup.exe"
          if (-not (Test-Path $installer)) {
            Write-Error "Installer not found: $installer"
            exit 1
          }
          $installProc = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait -PassThru
          if ($installProc.ExitCode -ne 0) {
            Write-Error "Setup.exe exited with code $($installProc.ExitCode) during silent install."
            exit 1
          }
          $installedExe = "$env:ProgramFiles\Attendance Management System\AttendanceManagementSystem.exe"
          if (-not (Test-Path $installedExe)) {
            Write-Error "Installed executable not found at $installedExe"
            exit 1
          }
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:APP_ENVIRONMENT = "testing"
          $env:DB_SQLITE_PATH = "$env:RUNNER_TEMP\smoke_installed.db"
          $crashLog = "$env:LOCALAPPDATA\AttendanceManagementSystem\logs\startup_crash.log"
          Remove-Item -Path $crashLog -ErrorAction SilentlyContinue
          $stdout = "$env:RUNNER_TEMP\installed_stdout.log"
          $stderr = "$env:RUNNER_TEMP\installed_stderr.log"
          $proc = Start-Process -FilePath $installedExe -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 15
          $failed = $false
          if ($proc.HasExited) {
            Write-Host "##[error] Installed executable exited early (code $($proc.ExitCode))."
            if (Test-Path $crashLog) {
              Write-Host "----- startup_crash.log -----"
              Get-Content $crashLog
            } else {
              Write-Host "No startup_crash.log was written either."
            }
            Write-Host "----- stdout -----"
            if (Test-Path $stdout) { Get-Content $stdout }
            Write-Host "----- stderr -----"
            if (Test-Path $stderr) { Get-Content $stderr }
            $failed = $true
          } else {
            Write-Host "OK: installed executable is still running after 15s (PID $($proc.Id))."
            Stop-Process -Id $proc.Id -Force
          }
          # Uninstall regardless of pass/fail, to leave the runner clean.
          # Inno Setup's uninstaller copies itself to a temp file and
          # relaunches from there to finish the job (so it can delete its
          # own original exe) - the outer process this starts does not
          # reliably exit when that handoff happens, so -Wait can hang
          # long past the point where uninstall has actually finished.
          # Bounded to 60s and never allowed to fail this step: cleaning
          # up after the test is a nicety, not part of what this test
          # verifies (the app already proved it starts, above).
          $uninstaller = "$env:ProgramFiles\Attendance Management System\unins000.exe"
          if (Test-Path $uninstaller) {
            $uninstallProc = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru
            $uninstallProc | Wait-Process -Timeout 60 -ErrorAction SilentlyContinue
            if (-not $uninstallProc.HasExited) {
              Write-Host "Uninstall did not finish within 60s - leaving it be, not treated as a smoke-test failure."
            }
          }
          if ($failed) { exit 1 }

      - name: Copy documentation into Release\
        run: |
          if exist "docs\README.pdf" copy /y "docs\README.pdf" "Release\README.pdf"
          if exist "docs\User Manual.pdf" copy /y "docs\User Manual.pdf" "Release\User Manual.pdf"
          if exist "docs\Administrator Manual.pdf" copy /y "docs\Administrator Manual.pdf" "Release\Administrator Manual.pdf"
          if exist "docs\Installation Guide.pdf" copy /y "docs\Installation Guide.pdf" "Release\Installation Guide.pdf"
          if exist "docs\Release Notes.pdf" copy /y "docs\Release Notes.pdf" "Release\Release Notes.pdf"
          if exist "CHANGELOG.md" copy /y "CHANGELOG.md" "Release\CHANGELOG.md"

      - name: Verify build output exists
        run: |
          if not exist "Release\Setup.exe" (echo Setup.exe missing & exit /b 1)
          if not exist "Release\Portable.exe" (echo Portable.exe missing & exit /b 1)

      - name: Upload Release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AttendanceManagementSystem-Windows-Release
          path: Release/
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Release/Setup.exe
            Release/Portable.exe
            Release/README.pdf
            Release/User Manual.pdf
            Release/Administrator Manual.pdf
            Release/CHANGELOG.md
          generate_release_notes: true
